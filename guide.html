<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Comment faire</title>
<link rel="stylesheet" href="chores.css" />
<style>
  body{max-width:760px;}
  .g-head{color:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;}
  .g-head h1{font-size:1.35rem;margin:0;flex:1;line-height:1.2;}
  .g-back{background:rgba(255,255,255,.25);color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;font-size:.95rem;cursor:pointer;margin-right:12px;}
  .intro{background:#fff4d6;border:2px solid #ffe39c;color:#7a5600;border-radius:16px;padding:12px 14px;margin-bottom:14px;font-weight:700;line-height:1.35;}
  .gstep{background:#fff;border:2px solid #eef2f8;border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px rgba(40,60,90,.07);}
  .gstep h2{font-size:1.15rem;margin:0 0 6px;}
  .gstep p{margin:8px 0 0;font-size:1.02rem;line-height:1.35;font-weight:600;}
  .gstep p.warn{color:#a12320;font-weight:800;}
  .gstep svg{width:100%;height:auto;max-width:420px;display:block;margin:0 auto;background:#f4f7fb;border-radius:14px;}
  .gck{display:block;margin-top:10px;padding:12px;border-radius:14px;border:3px solid #cfd9e8;background:#fff;font-weight:800;font-size:1.05rem;cursor:pointer;color:#23304a;text-align:center;}
  .gck.on{background:#34c77b;border-color:#34c77b;color:#fff;}
  .gbtns .gbtn{margin:0 6px 6px 0;}
  .gbtn{padding:12px 16px;border-radius:14px;border:none;background:#5b8def;color:#fff;font-weight:800;font-size:1.05rem;cursor:pointer;}
  .gtimer{display:none;margin-top:10px;text-align:center;background:#23304a;color:#fff;border-radius:16px;padding:12px;}
  .gtimer.show{display:block;}
  .gtimer .big{font-size:3.6rem;font-weight:800;line-height:1;}
  .gtimer .lbl{font-size:1.05rem;opacity:.9;margin-bottom:4px;}
  .gtimer .nx{font-size:.95rem;opacity:.85;margin-top:6px;}
  .gtimer.end{background:#2fa968;}
  .gstop{margin-top:10px;background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:12px;padding:8px 14px;font-weight:800;font-size:.95rem;cursor:pointer;}
  #finish{display:block;width:100%;border:none;border-radius:18px;padding:18px;font-size:1.3rem;font-weight:800;color:#fff;background:#b9c4d6;cursor:pointer;}
  #finish.ready{background:#2fa968;}
  #left{text-align:center;color:#6b7a90;margin-top:8px;font-weight:600;}
</style>
</head>
<body>
<div class="g-head" id="head"><div class="g-back" id="back">← Retour</div><h1 id="title">Comment faire</h1></div>
<div id="steps"></div>
<button id="finish">C'est fait ✅</button>
<div id="left"></div>
<script>
(function(){
  var q=["children.js","chores-core.js","guide.js"], t=Date.now();
  function next(){
    if(!q.length) return;
    var s=document.createElement("script"); s.src=q.shift()+(location.protocol==="file:"?"":"?t="+t); s.onload=next; document.body.appendChild(s);
  }
  next();
})();
</script>
</body>
</html>
