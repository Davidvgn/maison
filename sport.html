<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Mon sport</title>
<link rel="stylesheet" href="chores.css" />
<style>
  body{max-width:760px;}
  .sp-head{color:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;}
  .sp-head h1{font-size:1.5rem;margin:0;flex:1;}
  .sp-back{background:rgba(255,255,255,.25);color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;font-size:.95rem;cursor:pointer;margin-right:12px;}
  .step{background:#fff;border:2px solid #eef2f8;border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px rgba(40,60,90,.07);}
  .step h2{font-size:1.2rem;margin:0 0 4px;}
  .step .what{font-size:1rem;color:#6b7a90;margin:0 0 10px;font-weight:600;}
  .exos{display:flex;flex-wrap:wrap;margin:0 -5px;}
  .exo{width:50%;padding:5px;}
  .exo .in{background:#f4f7fb;border-radius:14px;padding:8px;text-align:center;}
  .exo .nm{font-weight:800;font-size:1.05rem;margin-top:4px;}
  .exo .nb{font-size:.95rem;color:#2f6fd0;font-weight:800;}
  .frames{display:flex;align-items:center;justify-content:center;}
  .frames svg{width:44%;height:auto;max-width:130px;}
  .frames .arrow{color:#aab6c8;font-weight:800;font-size:1.1rem;padding:0 2px;}
  .single svg{width:60%;max-width:200px;}
  .chips{display:flex;flex-wrap:wrap;margin:8px -4px 0;}
  .chip2{margin:4px;padding:10px 14px;border-radius:14px;border:3px solid #cfd9e8;background:#fff;font-weight:800;font-size:1.05rem;cursor:pointer;color:#23304a;}
  .chip2.on{background:#34c77b;border-color:#34c77b;color:#fff;}
  .btns{display:flex;flex-wrap:wrap;margin:8px -4px 0;}
  .tbtn{margin:4px;padding:12px 16px;border-radius:14px;border:none;background:#5b8def;color:#fff;font-weight:800;font-size:1.05rem;cursor:pointer;}
  .tbtn.pause{background:#e08a1e;}
  .timer{display:none;margin-top:10px;text-align:center;background:#23304a;color:#fff;border-radius:16px;padding:12px;}
  .timer.show{display:block;}
  .timer .big{font-size:3.4rem;font-weight:800;line-height:1;}
  .timer .lbl{font-size:1rem;opacity:.85;margin-bottom:4px;}
  .timer.end{background:#2fa968;}
  .timer.resting{background:#e08a1e;}
  .timer .nx{font-size:.95rem;opacity:.85;margin-top:6px;}
  .timer .stop{margin-top:10px;background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:12px;padding:8px 14px;font-weight:800;font-size:.95rem;cursor:pointer;}
  .exo .wt{font-size:.85rem;font-weight:800;color:#5b6b86;margin-top:3px;}
  .exo .wn{font-size:.78rem;color:#6b7a90;margin-top:3px;line-height:1.25;}
  .rest{text-align:center;color:#6b7a90;font-weight:800;margin:6px 0 14px;}
  #finish{display:block;width:100%;border:none;border-radius:18px;padding:18px;font-size:1.3rem;font-weight:800;color:#fff;background:#b9c4d6;cursor:pointer;}
  #finish.ready{background:#2fa968;}
  #left{text-align:center;color:#6b7a90;margin-top:8px;font-weight:600;}
</style>
</head>
<body>
<div class="sp-head" id="head"><div class="sp-back" id="back">← Retour</div><h1 id="title">Mon sport</h1></div>
<div id="steps"></div>
<button id="finish">J'ai tout fait ✅</button>
<div id="left"></div>
<script>
(function(){
  var q=["children.js","chores-core.js","sport.js"], t=Date.now();
  function next(){
    if(!q.length) return;
    var s=document.createElement("script"); s.src=q.shift()+(location.protocol==="file:"?"":"?t="+t); s.onload=next; document.body.appendChild(s);
  }
  next();
})();
</script>
</body>
</html>
